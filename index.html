<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tofaş Drift & Park">
    <title>Tofaş Doğan SLX Drift & Park 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #12141a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }

        /* Üst Sol Panel */
        .hud-top-left {
            position: absolute; top: 14px; left: 14px;
            display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white; padding: 9px 14px; border-radius: 12px;
        }
        .level-title { font-size: 14px; font-weight: 800; color: #f59e0b; }
        .sub-info { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
        .top-btns { display: flex; gap: 6px; }
        .btn-ui {
            background: rgba(15, 23, 42, 0.85); color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 7px 10px; border-radius: 9px; font-weight: 700; font-size: 11px;
            cursor: pointer;
        }
        .btn-ui:active { background: rgba(245, 158, 11, 0.5); }

        /* Üst Sağ: Hız ve Devir Göstergesi (Tofaş Kadranı) */
        .dashboard {
            position: absolute; top: 14px; right: 14px;
            background: rgba(10, 14, 22, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px; padding: 10px 14px;
            display: flex; align-items: center; gap: 12px;
            color: white; z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .rpm-gauge { position: relative; width: 76px; height: 76px; }
        .rpm-gauge svg { width: 100%; height: 100%; transform: rotate(135deg); }
        .rpm-bg { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 7; stroke-dasharray: 180 360; stroke-linecap: round; }
        .rpm-fill { fill: none; stroke: #f59e0b; stroke-width: 7; stroke-dasharray: 0 360; stroke-linecap: round; transition: stroke 0.1s; }
        .rpm-center {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        .rpm-val { font-size: 14px; font-weight: 900; color: #fff; line-height: 1; }
        .rpm-label { font-size: 8px; color: #94a3b8; font-weight: 700; margin-top: 2px; }

        .speed-digital { display: flex; flex-direction: column; align-items: flex-end; min-width: 58px; }
        .speed-num { font-size: 28px; font-weight: 900; line-height: 1; color: #38bdf8; font-variant-numeric: tabular-nums; }
        .speed-unit { font-size: 10px; font-weight: 800; color: #94a3b8; margin-top: 2px; }
        .drift-badge {
            margin-top: 4px; font-size: 9px; font-weight: 900; padding: 2px 6px;
            border-radius: 4px; background: #ef4444; color: white; display: none;
            animation: pulse 0.4s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }

        /* Park İlerleme Çubuğu */
        .park-progress-wrap {
            position: absolute; top: 105px; left: 50%; transform: translateX(-50%);
            width: 220px; background: rgba(0,0,0,0.8); border-radius: 20px;
            padding: 5px; display: none; border: 1px solid #10b981; z-index: 10;
        }
        .park-progress-bar { height: 9px; width: 0%; background: #10b981; border-radius: 16px; }
        .park-progress-text { text-align: center; color: #10b981; font-size: 10px; font-weight: 800; margin-top: 3px; }

        /* Kontroller */
        .controls-left {
            position: absolute; bottom: 22px; left: 18px;
            display: flex; gap: 12px; z-index: 10;
        }
        .controls-right {
            position: absolute; bottom: 22px; right: 18px;
            display: flex; gap: 9px; align-items: flex-end; z-index: 10;
        }
        .ctrl-btn {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            color: white; font-size: 22px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(245, 158, 11, 0.75); border-color: #f59e0b; transform: scale(0.94);
        }
        .handbrake-btn {
            width: 54px; height: 64px; border-radius: 14px;
            font-size: 10px; font-weight: 900; text-align: center; line-height: 1.2;
            border-color: rgba(245, 158, 11, 0.75); color: #fbbf24;
        }
        .handbrake-btn.active { background: rgba(245, 158, 11, 0.85); color: #0f172a; }
        .pedal {
            width: 56px; height: 82px; border-radius: 14px;
            font-size: 11px; flex-direction: column;
        }
        .pedal-brake { border-color: rgba(239, 68, 68, 0.75); }
        .pedal-brake.active { background: rgba(239, 68, 68, 0.8); border-color: #ef4444; }
        .pedal-gas { border-color: rgba(16, 185, 129, 0.75); height: 94px; }
        .pedal-gas.active { background: rgba(16, 185, 129, 0.8); border-color: #10b981; }

        .gear-btn {
            width: 46px; height: 46px; border-radius: 12px;
            font-size: 17px; font-weight: 900;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; color: #38bdf8;
        }
        .gear-btn.reverse { border-color: #ef4444; color: #ef4444; }

        .signature {
            position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
            font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.45);
            pointer-events: none; z-index: 5;
        }

        .modal {
            position: absolute; inset: 0; background: rgba(10, 15, 25, 0.88);
            backdrop-filter: blur(8px); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 30;
            text-align: center; padding: 20px;
        }
        .modal h2 { font-size: 28px; margin: 0 0 8px 0; color: #f59e0b; }
        .modal p { color: #cbd5e1; margin: 0 0 20px 0; font-size: 14px; }
        .modal-btn {
            background: #f59e0b; color: #0f172a; border: none;
            padding: 13px 26px; border-radius: 12px; font-size: 15px; font-weight: 800;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div class="hud-top-left">
        <div class="panel">
            <div class="level-title" id="levelText">BÖLÜM 1 / 5</div>
            <div class="sub-info" id="hintText">Model yükleniyor...</div>
        </div>
        <div class="top-btns">
            <button class="btn-ui" id="btnSound" onclick="toggleSound()">Ses: Açık</button>
            <button class="btn-ui" onclick="toggleCamera()">Kamera</button>
            <button class="btn-ui" onclick="resetLevel()">Sıfırla</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="rpm-gauge">
            <svg viewBox="0 0 100 100">
                <circle class="rpm-bg" cx="50" cy="50" r="40"></circle>
                <circle class="rpm-fill" id="rpmArc" cx="50" cy="50" r="40"></circle>
            </svg>
            <div class="rpm-center">
                <div class="rpm-val" id="rpmText">0.9</div>
                <div class="rpm-label">x1000 RPM</div>
            </div>
        </div>
        <div class="speed-digital">
            <div class="speed-num" id="speedText">0</div>
            <div class="speed-unit">KM/H</div>
            <div class="drift-badge" id="driftBadge">YANLIYOR!</div>
        </div>
    </div>

    <div class="park-progress-wrap" id="parkWrap">
        <div class="park-progress-bar" id="parkBar"></div>
        <div class="park-progress-text">PARK EDİLİYOR... SABİT DUR</div>
    </div>

    <div class="controls-left">
        <div class="ctrl-btn" id="btnLeft">◀</div>
        <div class="ctrl-btn" id="btnRight">▶</div>
    </div>

    <div class="controls-right">
        <div class="ctrl-btn gear-btn" id="btnGear" onclick="toggleGear()">D</div>
        <div class="ctrl-btn handbrake-btn" id="btnHandbrake">EL<br>FRENİ</div>
        <div class="ctrl-btn pedal pedal-brake" id="btnBrake">FREN</div>
        <div class="ctrl-btn pedal pedal-gas" id="btnGas">GAZ</div>
    </div>

    <div class="signature">Geliştirici: Yasin Karakaş</div>

    <div class="modal" id="modal">
        <h2 id="modalTitle">ÇARPTIN!</h2>
        <p id="modalDesc">Diğer araçlara veya dubalara dokunmadan park etmelisin.</p>
        <button class="modal-btn" id="modalBtn" onclick="handleModalAction()">Tekrar Dene</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- TOFAŞ MOTOR & LASTİK KAYMA SES SİSTEMİ ---
        let audioCtx = null;
        let soundEnabled = true;
        let engineOsc1, engineOsc2, subBassOsc, engineGain, filterNode, lfoOsc, lfoGain;
        let tireNoiseNode, tireGain, tireFilter;
        let isAudioStarted = false;

        function initAudio() {
            if (isAudioStarted || !soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                // Motor Osilatörleri
                engineOsc1 = audioCtx.createOscillator();
                engineOsc2 = audioCtx.createOscillator();
                subBassOsc = audioCtx.createOscillator();

                engineOsc1.type = 'sawtooth';
                engineOsc2.type = 'triangle';
                subBassOsc.type = 'sine';

                lfoOsc = audioCtx.createOscillator();
                lfoGain = audioCtx.createGain();
                lfoOsc.type = 'sine';
                lfoOsc.frequency.value = 7.8;
                lfoGain.gain.value = 5.0;
                lfoOsc.connect(lfoGain);
                lfoGain.connect(engineOsc1.frequency);

                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 180;
                filterNode.Q.value = 4.5;

                engineGain = audioCtx.createGain();
                engineGain.gain.value = 0.14;

                engineOsc1.connect(filterNode);
                engineOsc2.connect(filterNode);
                subBassOsc.connect(filterNode);
                filterNode.connect(engineGain);
                engineGain.connect(audioCtx.destination);

                engineOsc1.start();
                engineOsc2.start();
                subBassOsc.start();
                lfoOsc.start();

                // Lastik Cıyaklama / Kayma Sesi (Bandpass Beyaz Gürültü)
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                tireNoiseNode = audioCtx.createBufferSource();
                tireNoiseNode.buffer = noiseBuffer;
                tireNoiseNode.loop = true;

                tireFilter = audioCtx.createBiquadFilter();
                tireFilter.type = 'bandpass';
                tireFilter.frequency.value = 1350;
                tireFilter.Q.value = 6.0;

                tireGain = audioCtx.createGain();
                tireGain.gain.value = 0;

                tireNoiseNode.connect(tireFilter);
                tireFilter.connect(tireGain);
                tireGain.connect(audioCtx.destination);
                tireNoiseNode.start();

                isAudioStarted = true;
            } catch (e) {}
        }

        function updateAudio(rpmRatio, slipIntensity) {
            if (!isAudioStarted || !audioCtx) return;
            if (!soundEnabled) {
                engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
                tireGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
                return;
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const baseFreq = 32 + rpmRatio * 92;
            engineOsc1.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.06);
            engineOsc2.frequency.setTargetAtTime(baseFreq * 2.02, audioCtx.currentTime, 0.06);
            subBassOsc.frequency.setTargetAtTime(baseFreq * 1.5, audioCtx.currentTime, 0.06);

            filterNode.frequency.setTargetAtTime(160 + rpmRatio * 560, audioCtx.currentTime, 0.06);
            lfoGain.gain.setTargetAtTime(rpmRatio > 0.25 ? 1.5 : 5.5, audioCtx.currentTime, 0.1);
            engineGain.gain.setTargetAtTime(0.13 + rpmRatio * 0.12, audioCtx.currentTime, 0.06);

            // Lastik kayma sesi
            const tireVol = Math.min(0.16, slipIntensity * 0.18);
            tireGain.gain.setTargetAtTime(tireVol, audioCtx.currentTime, 0.05);
            tireFilter.frequency.setTargetAtTime(1200 + slipIntensity * 500, audioCtx.currentTime, 0.05);
        }

        function playCrashSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(115, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.36);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('btnSound').innerText = soundEnabled ? 'Ses: Açık' : 'Ses: Kapalı';
            if (soundEnabled && !isAudioStarted) initAudio();
        }

        // --- THREE.JS SAHNE KURULUMU ---
        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x18202c);
        scene.fog = new THREE.Fog(0x18202c, 45, 130);

        const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 180);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.9);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
        dirLight.position.set(25, 42, 25);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 38;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Geniş Asfalt Drift & Park Alanı
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(160, 160),
            new THREE.MeshStandardMaterial({ color: 0x242529, roughness: 0.85 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(140, 70, 0x3f3f46, 0x2e2f34);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- LASTİK İZLERİ VE EGZOZ/LASTİK DUMANI EFEKTLERİ ---
        const skidMarks = [];
        const skidMat = new THREE.MeshBasicMaterial({ color: 0x09090b, transparent: true, opacity: 0.65, side: THREE.DoubleSide });
        const skidGeo = new THREE.PlaneGeometry(0.24, 0.45);

        function spawnSkidMark(x, z, rotY) {
            const mark = new THREE.Mesh(skidGeo, skidMat);
            mark.rotation.x = -Math.PI / 2;
            mark.rotation.z = -rotY;
            mark.position.set(x, 0.018, z);
            scene.add(mark);
            skidMarks.push(mark);
            if (skidMarks.length > 260) {
                const old = skidMarks.shift();
                scene.remove(old);
            }
        }

        const smokeParticles = [];
        const smokeGeo = new THREE.SphereGeometry(0.22, 6, 6);
        function spawnSmoke(x, z) {
            const mat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.45 });
            const p = new THREE.Mesh(smokeGeo, mat);
            p.position.set(x + (Math.random() - 0.5) * 0.3, 0.2, z + (Math.random() - 0.5) * 0.3);
            scene.add(p);
            smokeParticles.push({ mesh: p, life: 1.0 });
        }

        // --- GERÇEK 3D MODEL YÜKLEYİCİ (tofas.glb & trafik.glb) ---
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        let externalTrafficTemplate = null;
        const gltfLoader = new THREE.GLTFLoader();

        // Otomatik Ölçekleme ve Ortalama Yardımcı Fonksiyonu
        function normalizeModel(model, targetLength = 4.3) {
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);

            const maxDim = Math.max(size.x, size.z);
            const scale = targetLength / maxDim;
            model.scale.setScalar(scale);

            // Ölçek sonrası tekrar kutu hesapla ve zemine oturt
            const scaledBox = new THREE.Box3().setFromObject(model);
            const center = new THREE.Vector3();
            scaledBox.getCenter(center);

            model.position.x -= center.x;
            model.position.z -= center.z;
            model.position.y -= scaledBox.min.y;

            model.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            return model;
        }

        // Yedek Tofaş Modeli (tofas.glb henüz yüklenmediyse devreye girer)
        function buildFallbackTofas() {
            const fallback = new THREE.Group();
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.1 });
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x18181b });

            const body = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.58, 4.28), whiteMat);
            body.position.y = 0.48;
            body.castShadow = true;
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.54, 2.15), whiteMat);
            cabin.position.set(0, 1.02, -0.18);
            const win = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.44, 1.98), glassMat);
            win.position.set(0, 1.02, -0.18);
            const b1 = new THREE.Mesh(new THREE.BoxGeometry(1.92, 0.25, 0.25), whiteMat);
            b1.position.set(0, 0.35, 2.16);
            const b2 = b1.clone(); b2.position.z = -2.16;

            fallback.add(body, cabin, win, b1, b2);
            [[-0.92, 1.32], [0.92, 1.32], [-0.92, -1.32], [0.92, -1.32]].forEach(([wx, wz]) => {
                const w = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.24, 20), blackMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(wx, 0.32, wz);
                fallback.add(w);
            });
            return fallback;
        }

        let fallbackMesh = buildFallbackTofas();
        carGroup.add(fallbackMesh);

        // GitHub'daki tofas.glb dosyasını yüklemeyi dene
        gltfLoader.load(
            'tofas.glb',
            (gltf) => {
                carGroup.remove(fallbackMesh);
                const tofasModel = normalizeModel(gltf.scene, 4.3);
                // Eğer model ters yöne bakıyorsa burada Math.PI eklenebilir
                carGroup.add(tofasModel);
                document.getElementById('hintText').innerText = levels[currentLevel].hint;
            },
            undefined,
            () => {
                // tofas.glb henüz atılmamışsa yedek modelle devam et
                document.getElementById('hintText').innerText = levels[currentLevel].hint + " (tofas.glb bekleniyor)";
            }
        );

        // Opsiyonel trafik.glb dosyasını yüklemeyi dene
        gltfLoader.load(
            'trafik.glb',
            (gltf) => {
                externalTrafficTemplate = normalizeModel(gltf.scene, 4.4);
                loadLevel(currentLevel);
            },
            undefined,
            () => {}
        );

        // --- PARK HALİNDEKİ ARAÇLAR VE ENGELLER ---
        let obstacles = [];

        function clearObstacles() {
            obstacles.forEach(o => scene.remove(o.mesh));
            obstacles = [];
        }

        function addTrafficCar(x, z, rotY, colorHex) {
            let npc;
            if (externalTrafficTemplate) {
                npc = externalTrafficTemplate.clone();
            } else {
                npc = new THREE.Group();
                const paint = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.25, metalness: 0.4 });
                const dark = new THREE.MeshStandardMaterial({ color: 0x0f172a });
                const tireMat = new THREE.MeshStandardMaterial({ color: 0x18181b });

                const body = new THREE.Mesh(new THREE.BoxGeometry(1.92, 0.65, 4.4), paint);
                body.position.y = 0.54;
                body.castShadow = true;
                const roof = new THREE.Mesh(new THREE.BoxGeometry(1.68, 0.56, 2.45), paint);
                roof.position.set(0, 1.12, -0.22);
                const win = new THREE.Mesh(new THREE.BoxGeometry(1.71, 0.45, 2.25), dark);
                win.position.set(0, 1.12, -0.22);
                npc.add(body, roof, win);

                [[-0.94, 1.35], [0.94, 1.35], [-0.94, -1.35], [0.94, -1.35]].forEach(([wx, wz]) => {
                    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.25, 16), tireMat);
                    t.rotation.z = Math.PI / 2;
                    t.position.set(wx, 0.34, wz);
                    npc.add(t);
                });
            }

            npc.position.set(x, 0, z);
            npc.rotation.y = rotY;
            scene.add(npc);

            const isRotated = Math.abs(Math.sin(rotY)) > 0.7;
            obstacles.push({
                x, z,
                w: isRotated ? 4.35 : 1.92,
                d: isRotated ? 1.92 : 4.35,
                mesh: npc
            });
        }

        function addCone(x, z) {
            const cone = new THREE.Mesh(
                new THREE.ConeGeometry(0.25, 0.75, 12),
                new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.4 })
            );
            cone.position.set(x, 0.375, z);
            cone.castShadow = true;
            scene.add(cone);
            obstacles.push({ x, z, w: 0.45, d: 0.45, mesh: cone });
        }

        function addBarrier(x, z, w, d) {
            const barrier = new THREE.Mesh(
                new THREE.BoxGeometry(w, 0.85, d),
                new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 })
            );
            barrier.position.set(x, 0.425, z);
            barrier.castShadow = true;
            scene.add(barrier);
            obstacles.push({ x, z, w, d, mesh: barrier });
        }

        // --- HEDEF PARK ALANI ---
        const targetZone = new THREE.Group();
        const zoneFloor = new THREE.Mesh(
            new THREE.PlaneGeometry(2.75, 5.1),
            new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.28, side: THREE.DoubleSide })
        );
        zoneFloor.rotation.x = -Math.PI / 2;
        zoneFloor.position.y = 0.03;
        targetZone.add(zoneFloor);

        const zoneBorder = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(2.75, 0.05, 5.1)),
            new THREE.LineBasicMaterial({ color: 0x10b981 })
        );
        zoneBorder.position.y = 0.04;
        targetZone.add(zoneBorder);
        scene.add(targetZone);

        const levels = [
            {
                hint: "Yanlayarak gel veya iki aracın arasına park et",
                start: { x: 0, z: -14, rot: 0 },
                target: { x: 0, z: 8, rot: 0 },
                setup: () => {
                    addTrafficCar(-3.2, 8, 0, 0x1e3a8a);
                    addTrafficCar(3.2, 8, 0, 0x991b1b);
                    addBarrier(0, 12, 10, 0.5);
                }
            },
            {
                hint: "El freniyle virajı dön ve iki araç arasına gir",
                start: { x: -12, z: -10, rot: 0 },
                target: { x: 8, z: 4, rot: Math.PI / 2 },
                setup: () => {
                    addTrafficCar(8, 0.6, Math.PI / 2, 0xdc2626);
                    addTrafficCar(8, 7.4, Math.PI / 2, 0x0f172a);
                    addBarrier(11.6, 4, 0.5, 13);
                    addCone(-2, 4);
                }
            },
            {
                hint: "Geri vites (R) ile paralel park yap",
                start: { x: 3.5, z: -5, rot: 0 },
                target: { x: 7.5, z: 4, rot: 0 },
                setup: () => {
                    addTrafficCar(7.5, -1.8, 0, 0xeab308);
                    addTrafficCar(7.5, 9.8, 0, 0x334155);
                    addBarrier(9.8, 4, 0.5, 18);
                }
            },
            {
                hint: "Dar koridordan yanlayıp L dönüşü ile park et",
                start: { x: -11, z: 8, rot: Math.PI / 2 },
                target: { x: 4, z: -7, rot: 0 },
                setup: () => {
                    addBarrier(-2, 2.5, 15, 0.5);
                    addTrafficCar(0.7, -7, 0, 0x475569);
                    addTrafficCar(7.3, -7, 0, 0xb91c1c);
                    addBarrier(4, -10.8, 10, 0.5);
                }
            },
            {
                hint: "Usta Şoför: Geniş pistte drift atıp ters park et",
                start: { x: -12, z: -12, rot: 0 },
                target: { x: 9, z: 9, rot: Math.PI },
                setup: () => {
                    addTrafficCar(5.7, 9, 0, 0x6d28d9);
                    addTrafficCar(12.3, 9, 0, 0x047857);
                    addBarrier(0, -1, 12, 0.5);
                    addBarrier(9, 12.8, 10, 0.5);
                }
            }
        ];

        // --- GERÇEKÇİ ARKADAN İTİŞ (RWD) DRİFT & KAYMA FİZİĞİ ---
        let currentLevel = 0;
        let carState = {
            x: 0, z: 0,
            vx: 0, vz: 0,       // Dünya koordinatında gerçek hız vektörü (kayma için!)
            rot: 0,            // Aracın baktığı yön
            angularVel: 0,     // Aracın kendi ekseninde dönme hızı (kıç atma)
            steer: 0,
            rpm: 900
        };
        let gear = 1;
        let inputs = { left: false, right: false, gas: false, brake: false, handbrake: false };
        let cameraMode = 0;
        let parkTimer = 0;
        let isGamePaused = false;
        let modalActionType = 'RETRY';
        let skidTimer = 0;

        function loadLevel(idx) {
            currentLevel = idx;
            const lvl = levels[idx];
            clearObstacles();
            lvl.setup();

            carState = { x: lvl.start.x, z: lvl.start.z, vx: 0, vz: 0, rot: lvl.start.rot, angularVel: 0, steer: 0, rpm: 900 };
            gear = 1;
            updateGearUI();
            parkTimer = 0;
            isGamePaused = false;
            document.getElementById('parkWrap').style.display = 'none';
            document.getElementById('modal').style.display = 'none';

            targetZone.position.set(lvl.target.x, 0, lvl.target.z);
            targetZone.rotation.y = lvl.target.rot;

            document.getElementById('levelText').innerText = `BÖLÜM ${idx + 1} / ${levels.length}`;
            document.getElementById('hintText').innerText = lvl.hint;
        }

        function resetLevel() { loadLevel(currentLevel); }

        function toggleGear() {
            initAudio();
            gear = gear === 1 ? -1 : 1;
            updateGearUI();
        }

        function updateGearUI() {
            const btn = document.getElementById('btnGear');
            if (gear === 1) {
                btn.innerText = 'D';
                btn.classList.remove('reverse');
            } else {
                btn.innerText = 'R';
                btn.classList.add('reverse');
            }
        }

        function toggleCamera() { cameraMode = (cameraMode + 1) % 3; }

        function bindBtn(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); initAudio(); inputs[key] = true; el.classList.add('active'); };
            const end = (e) => { e.preventDefault(); inputs[key] = false; el.classList.remove('active'); };
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);
        }

        bindBtn('btnLeft', 'left');
        bindBtn('btnRight', 'right');
        bindBtn('btnGas', 'gas');
        bindBtn('btnBrake', 'brake');
        bindBtn('btnHandbrake', 'handbrake');

        window.addEventListener('keydown', e => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = true;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = true;
            if (e.code === 'Space') { e.preventDefault(); inputs.handbrake = true; }
            if (e.key === 'r' || e.key === 'R') toggleGear();
            if (e.key === 'c' || e.key === 'C') toggleCamera();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = false;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = false;
            if (e.code === 'Space') inputs.handbrake = false;
        });

        function checkCollisions() {
            const halfW = 0.86;
            const halfL = 2.02;
            const cos = Math.cos(carState.rot);
            const sin = Math.sin(carState.rot);

            const corners = [
                { x: carState.x + halfW * cos + halfL * sin, z: carState.z - halfW * sin + halfL * cos },
                { x: carState.x - halfW * cos + halfL * sin, z: carState.z + halfW * sin + halfL * cos },
                { x: carState.x + halfW * cos - halfL * sin, z: carState.z - halfW * sin - halfL * cos },
                { x: carState.x - halfW * cos - halfL * sin, z: carState.z + halfW * sin - halfL * cos }
            ];

            for (let obs of obstacles) {
                const minX = obs.x - obs.w / 2;
                const maxX = obs.x + obs.w / 2;
                const minZ = obs.z - obs.d / 2;
                const maxZ = obs.z + obs.d / 2;

                for (let pt of corners) {
                    if (pt.x > minX && pt.x < maxX && pt.z > minZ && pt.z < maxZ) return true;
                }
            }
            return false;
        }

        function showModal(title, desc, btnText, actionType) {
            isGamePaused = true;
            modalActionType = actionType;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalBtn').innerText = btnText;
            document.getElementById('modal').style.display = 'flex';
        }

        function handleModalAction() {
            if (modalActionType === 'NEXT') loadLevel((currentLevel + 1) % levels.length);
            else resetLevel();
        }

        // --- HIZ & DEVİR KADRANI GÜNCELLEME ---
        const rpmArc = document.getElementById('rpmArc');
        const rpmText = document.getElementById('rpmText');
        const speedText = document.getElementById('speedText');
        const driftBadge = document.getElementById('driftBadge');

        function updateDashboard(speedMetersPerSec, rpm, isDrifting) {
            const kmh = Math.round(speedMetersPerSec * 7.2); // Gerçekçi kadran ölçeği
            speedText.innerText = kmh;

            const rpmThousands = (rpm / 1000).toFixed(1);
            rpmText.innerText = rpmThousands;

            // SVG Yay uzunluğu (Max 188 birim)
            const ratio = Math.min(Math.max((rpm - 800) / 6200, 0), 1);
            rpmArc.style.strokeDasharray = `${ratio * 188} 360`;
            rpmArc.style.stroke = rpm > 5600 ? '#ef4444' : (rpm > 4000 ? '#f59e0b' : '#38bdf8');

            driftBadge.style.display = isDrifting ? 'block' : 'none';
        }

        // --- ANA FİZİK VE OYUN DÖNGÜSÜ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            // Duman parçacıklarını güncelle
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const p = smokeParticles[i];
                p.life -= dt * 1.6;
                p.mesh.position.y += dt * 0.9;
                p.mesh.scale.addScalar(dt * 1.8);
                p.mesh.material.opacity = Math.max(0, p.life * 0.4);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    smokeParticles.splice(i, 1);
                }
            }

            if (!isGamePaused) {
                // 1. Direksiyon Açısı
                const maxSteer = 0.58;
                if (inputs.left) carState.steer = Math.min(carState.steer + 3.2 * dt, maxSteer);
                else if (inputs.right) carState.steer = Math.max(carState.steer - 3.2 * dt, -maxSteer);
                else carState.steer *= 0.82;

                // 2. Aracın Yön Vektörleri (İleri ve Sağ/Yan)
                const forwardX = Math.sin(carState.rot);
                const forwardZ = Math.cos(carState.rot);
                const rightX = Math.cos(carState.rot);
                const rightZ = -Math.sin(carState.rot);

                // Mevcut hızı ileri ve yanal (kayma) bileşenlerine ayır
                let forwardSpeed = carState.vx * forwardX + carState.vz * forwardZ;
                let lateralSpeed = carState.vx * rightX + carState.vz * rightZ;

                // 3. Gaz, Fren ve El Freni Kuvvetleri
                const enginePower = gear === 1 ? 15.5 : 8.5;
                const maxSpeed = gear === 1 ? 17.5 : 7.5;

                if (inputs.gas) {
                    forwardSpeed += gear * enginePower * dt;
                    if (gear === 1 && forwardSpeed > maxSpeed) forwardSpeed = maxSpeed;
                    if (gear === -1 && forwardSpeed < -maxSpeed) forwardSpeed = -maxSpeed;
                } else {
                    forwardSpeed *= (1 - 0.85 * dt); // Motor freni / yuvarlanma direnci
                }

                // Normal Fren (Direkt durmaz, kızaklayarak/kayarak yavaşlar)
                if (inputs.brake) {
                    forwardSpeed *= (1 - 3.6 * dt);
                }

                // El Freni (Arka tekerleri kilitler, sert yanlama başlatır)
                if (inputs.handbrake) {
                    forwardSpeed *= (1 - 2.4 * dt);
                }

                if (Math.abs(forwardSpeed) < 0.04 && !inputs.gas) forwardSpeed = 0;

                // 4. Arkadan İtiş (RWD) Yanal Tutuş ve Drift Fiziği
                // El freni çekiliyse veya hızlıyken tam gaz direksiyon kırılıyorsa arka tutuş düşer!
                const isPowerSliding = inputs.gas && Math.abs(forwardSpeed) > 6.5 && Math.abs(carState.steer) > 0.25;
                const isBrakingHard = inputs.brake && Math.abs(forwardSpeed) > 7.5 && Math.abs(carState.steer) > 0.2;

                let lateralGrip = 6.8; // Normal asfalt tutuşu
                if (inputs.handbrake) lateralGrip = 1.45; // El freninde buz gibi kayar
                else if (isPowerSliding) lateralGrip = 2.1; // Gazla yanlama (Power oversteer)
                else if (isBrakingHard) lateralGrip = 2.6; // Frenle kayma

                // Yanal hızı tutuş katsayısına göre sönümle (Düşük tutuş = uzun süre yanlama)
                lateralSpeed *= Math.exp(-lateralGrip * dt);

                // 5. Dönüş ve Kıç Atma (Yaw Rate)
                const speedFactor = Math.min(Math.abs(forwardSpeed) / 3.5, 1.2);
                const dirSign = forwardSpeed >= -0.05 ? 1 : -1;
                let targetTurnRate = carState.steer * 2.45 * speedFactor * dirSign;

                // El freni veya gazla yanlarken arka taraf ekstra savrulur
                if (inputs.handbrake && Math.abs(forwardSpeed) > 2.5) {
                    targetTurnRate *= 1.55;
                } else if (isPowerSliding) {
                    targetTurnRate *= 1.32;
                }

                carState.angularVel += (targetTurnRate - carState.angularVel) * Math.min(1, 10 * dt);
                carState.rot += carState.angularVel * dt;

                // Yeni yön vektörleriyle dünya hızını tekrar birleştir
                const newFwdX = Math.sin(carState.rot);
                const newFwdZ = Math.cos(carState.rot);
                const newRightX = Math.cos(carState.rot);
                const newRightZ = -Math.sin(carState.rot);

                carState.vx = newFwdX * forwardSpeed + newRightX * lateralSpeed;
                carState.vz = newFwdZ * forwardSpeed + newRightZ * lateralSpeed;

                carState.x += carState.vx * dt;
                carState.z += carState.vz * dt;

                // 6. Kayma Şiddeti, Lastik İzi ve Duman
                const totalSpeed = Math.hypot(carState.vx, carState.vz);
                const slipIntensity = Math.min(1, (Math.abs(lateralSpeed) / 4.2) + (inputs.handbrake && totalSpeed > 2 ? 0.5 : 0));
                const isDrifting = slipIntensity > 0.35 && totalSpeed > 2.5;

                if (isDrifting) {
                    skidTimer += dt;
                    if (skidTimer > 0.035) {
                        skidTimer = 0;
                        // Arka sol ve arka sağ tekerlek koordinatları
                        const rearCenterX = carState.x - newFwdX * 1.35;
                        const rearCenterZ = carState.z - newFwdZ * 1.35;
                        const rlX = rearCenterX - newRightX * 0.85;
                        const rlZ = rearCenterZ - newRightZ * 0.85;
                        const rrX = rearCenterX + newRightX * 0.85;
                        const rrZ = rearCenterZ + newRightZ * 0.85;

                        spawnSkidMark(rlX, rlZ, carState.rot);
                        spawnSkidMark(rrX, rrZ, carState.rot);
                        spawnSmoke(rlX, rlZ);
                        spawnSmoke(rrX, rrZ);
                    }
                }

                // 7. Motor Devri (RPM) Hesaplama (Yanlarken kesiciye yaklaşır)
                const wheelRpm = 900 + (Math.abs(forwardSpeed) / maxSpeed) * 5200;
                const slipBonusRpm = isDrifting && inputs.gas ? 1100 : 0;
                const gasRev = inputs.gas ? Math.max(wheelRpm + slipBonusRpm, 2600) : wheelRpm;
                const targetRpm = Math.min(6800, gasRev);
                carState.rpm += (targetRpm - carState.rpm) * Math.min(1, 8 * dt);

                const rpmRatio = (carState.rpm - 900) / 5900;
                updateAudio(rpmRatio, isDrifting ? slipIntensity : 0);
                updateDashboard(totalSpeed, carState.rpm, isDrifting);

                // 3D Aracı Konumlandır (Yanlarken hafif gövde yatması / body roll ekli!)
                carGroup.position.set(carState.x, 0, carState.z);
                carGroup.rotation.y = carState.rot;
                carGroup.rotation.z = Math.max(-0.07, Math.min(0.07, -lateralSpeed * 0.015));

                // Çarpışma Kontrolü
                if (checkCollisions()) {
                    playCrashSound();
                    showModal("ÇARPTIN!", "Tofaş'ı vurmadan tekrar dene.", "Tekrar Dene", "RETRY");
                }

                // Park Kontrolü
                const lvl = levels[currentLevel];
                const dist = Math.hypot(carState.x - lvl.target.x, carState.z - lvl.target.z);
                let angleDiff = Math.abs((carState.rot - lvl.target.rot) % (Math.PI * 2));
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (dist < 0.9 && angleDiff < 0.24 && totalSpeed < 0.25) {
                    parkTimer += dt;
                    document.getElementById('parkWrap').style.display = 'block';
                    document.getElementById('parkBar').style.width = `${Math.min((parkTimer / 1.5) * 100, 100)}%`;
                    zoneFloor.material.color.setHex(0x38bdf8);

                    if (parkTimer >= 1.5) {
                        const isLast = currentLevel === levels.length - 1;
                        showModal(
                            isLast ? "TÜM BÖLÜMLER BİTTİ!" : "MÜKEMMEL PARK!",
                            isLast ? "Tofaş ile hem yanladın hem tüm parkurları bitirdin!" : `Bölüm ${currentLevel + 1} tamamlandı.`,
                            isLast ? "Baştan Oyna" : "Sonraki Bölüm",
                            "NEXT"
                        );
                    }
                } else {
                    parkTimer = 0;
                    document.getElementById('parkWrap').style.display = 'none';
                    zoneFloor.material.color.setHex(0x10b981);
                }
            } else {
                updateAudio(0, 0);
            }

            // Kamera Takibi
            if (cameraMode === 0) {
                const offsetDist = gear === 1 ? -7.8 : 7.8;
                const targetCamX = carState.x + Math.sin(carState.rot) * offsetDist;
                const targetCamZ = carState.z + Math.cos(carState.rot) * offsetDist;
                camera.position.lerp(new THREE.Vector3(targetCamX, 4.6, targetCamZ), 0.12);
                camera.lookAt(carState.x, 0.9, carState.z);
            } else if (cameraMode === 1) {
                camera.position.lerp(new THREE.Vector3(carState.x, 15, carState.z - 2), 0.15);
                camera.lookAt(carState.x, 0, carState.z);
            } else {
                const hoodX = carState.x + Math.sin(carState.rot) * 0.5;
                const hoodZ = carState.z + Math.cos(carState.rot) * 0.5;
                camera.position.set(hoodX, 1.45, hoodZ);
                camera.lookAt(
                    carState.x + Math.sin(carState.rot) * 10,
                    1.1,
                    carState.z + Math.cos(carState.rot) * 10
                );
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadLevel(0);
        animate();
    </script>
</body>
</html>

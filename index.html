<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Doğan SLX Park 3D">
    <title>Tofaş Doğan SLX Park 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #18181b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }

        .hud-top {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }
        .panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white; padding: 10px 14px; border-radius: 12px;
            pointer-events: auto;
        }
        .level-title { font-size: 15px; font-weight: 800; color: #f59e0b; }
        .sub-info { font-size: 12px; color: #cbd5e1; margin-top: 2px; }
        .top-btns { display: flex; gap: 6px; pointer-events: auto; }
        .btn-ui {
            background: rgba(15, 23, 42, 0.82); color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 11px; border-radius: 10px; font-weight: 700; font-size: 12px;
            cursor: pointer; backdrop-filter: blur(6px);
        }
        .btn-ui:active { background: rgba(245, 158, 11, 0.4); }

        .park-progress-wrap {
            position: absolute; top: 78px; left: 50%; transform: translateX(-50%);
            width: 230px; background: rgba(0,0,0,0.75); border-radius: 20px;
            padding: 5px; display: none; border: 1px solid #10b981; z-index: 10;
        }
        .park-progress-bar {
            height: 10px; width: 0%; background: #10b981; border-radius: 16px;
            transition: width 0.08s linear;
        }
        .park-progress-text {
            text-align: center; color: #10b981; font-size: 11px; font-weight: 800;
            margin-top: 3px;
        }

        .controls-left {
            position: absolute; bottom: 25px; left: 20px;
            display: flex; gap: 12px; z-index: 10;
        }
        .controls-right {
            position: absolute; bottom: 25px; right: 20px;
            display: flex; gap: 10px; align-items: flex-end; z-index: 10;
        }
        .ctrl-btn {
            width: 66px; height: 66px; border-radius: 50%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            color: white; font-size: 22px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(245, 158, 11, 0.75); border-color: #f59e0b; transform: scale(0.94);
        }
        .pedal {
            width: 60px; height: 86px; border-radius: 14px;
            font-size: 12px; flex-direction: column; gap: 4px;
        }
        .pedal-brake { border-color: rgba(239, 68, 68, 0.7); }
        .pedal-brake.active { background: rgba(239, 68, 68, 0.75); border-color: #ef4444; }
        .pedal-gas { border-color: rgba(16, 185, 129, 0.7); height: 96px; }
        .pedal-gas.active { background: rgba(16, 185, 129, 0.75); border-color: #10b981; }

        .gear-btn {
            width: 50px; height: 50px; border-radius: 12px;
            font-size: 18px; font-weight: 900;
            background: rgba(15, 23, 42, 0.88); border: 2px solid #38bdf8; color: #38bdf8;
        }
        .gear-btn.reverse { border-color: #ef4444; color: #ef4444; }

        .signature {
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.45);
            pointer-events: none; z-index: 5;
        }

        .modal {
            position: absolute; inset: 0; background: rgba(10, 15, 25, 0.88);
            backdrop-filter: blur(8px); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 30;
            text-align: center; padding: 20px;
        }
        .modal h2 { font-size: 30px; margin: 0 0 8px 0; color: #f59e0b; }
        .modal p { color: #cbd5e1; margin: 0 0 20px 0; font-size: 15px; }
        .modal-btn {
            background: #f59e0b; color: #0f172a; border: none;
            padding: 14px 28px; border-radius: 12px; font-size: 16px; font-weight: 800;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="hud-top">
        <div class="panel">
            <div class="level-title" id="levelText">BÖLÜM 1 / 5</div>
            <div class="sub-info" id="hintText">Doğan SLX'i yeşil alana park et</div>
        </div>
        <div class="top-btns">
            <button class="btn-ui" id="btnSound" onclick="toggleSound()">Ses: Açık</button>
            <button class="btn-ui" onclick="toggleCamera()">Kamera</button>
            <button class="btn-ui" onclick="resetLevel()">Sıfırla</button>
        </div>
    </div>

    <div class="park-progress-wrap" id="parkWrap">
        <div class="park-progress-bar" id="parkBar"></div>
        <div class="park-progress-text">PARK EDİLİYOR... SABİT DUR</div>
    </div>

    <div class="controls-left">
        <div class="ctrl-btn" id="btnLeft">◀</div>
        <div class="ctrl-btn" id="btnRight">▶</div>
    </div>

    <div class="controls-right">
        <div class="ctrl-btn gear-btn" id="btnGear" onclick="toggleGear()">D</div>
        <div class="ctrl-btn pedal pedal-brake" id="btnBrake">FREN</div>
        <div class="ctrl-btn pedal pedal-gas" id="btnGas">GAZ</div>
    </div>

    <div class="signature">Geliştirici: Yasin Karakaş</div>

    <div class="modal" id="modal">
        <h2 id="modalTitle">ÇARPTIN!</h2>
        <p id="modalDesc">Diğer araçlara veya dubalara dokunmadan park etmelisin.</p>
        <button class="modal-btn" id="modalBtn" onclick="handleModalAction()">Tekrar Dene</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- TOFAŞ MOTOR & EGZOZ SES MOTORU (WEB AUDIO API) ---
        let audioCtx = null;
        let soundEnabled = true;
        let engineOsc1, engineOsc2, subBassOsc, engineGain, filterNode, lfoOsc, lfoGain;
        let isAudioStarted = false;

        function initAudio() {
            if (isAudioStarted || !soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                // Ana motor sesi (4 silindirli 1.6 karbüratörlü karakteri)
                engineOsc1 = audioCtx.createOscillator();
                engineOsc2 = audioCtx.createOscillator();
                subBassOsc = audioCtx.createOscillator(); // Abartı / tok egzoz bası

                engineOsc1.type = 'sawtooth';
                engineOsc2.type = 'triangle';
                subBassOsc.type = 'sine';

                engineOsc1.frequency.value = 38;
                engineOsc2.frequency.value = 76;
                subBassOsc.frequency.value = 55;

                // Dereceli egzantrik / karbüratör rölanti dalgalanması (pır-pır efekti)
                lfoOsc = audioCtx.createOscillator();
                lfoGain = audioCtx.createGain();
                lfoOsc.type = 'sine';
                lfoOsc.frequency.value = 7.5; // Rölanti patırtı hızı
                lfoGain.gain.value = 4.5;
                lfoOsc.connect(lfoGain);
                lfoGain.connect(engineOsc1.frequency);

                // Egzoz susturucu filtresi (tiz cızırtıyı kesip tok ses verir)
                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 180;
                filterNode.Q.value = 4.5;

                engineGain = audioCtx.createGain();
                engineGain.gain.value = 0.14;

                engineOsc1.connect(filterNode);
                engineOsc2.connect(filterNode);
                subBassOsc.connect(filterNode);
                filterNode.connect(engineGain);
                engineGain.connect(audioCtx.destination);

                engineOsc1.start();
                engineOsc2.start();
                subBassOsc.start();
                lfoOsc.start();

                isAudioStarted = true;
            } catch (e) {
                console.log("Ses başlatılamadı:", e);
            }
        }

        function updateEngineSound(speed, isGasPressed, dt) {
            if (!isAudioStarted || !audioCtx) return;
            if (!soundEnabled) {
                engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
                return;
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const absSpeed = Math.abs(speed);
            // Gaza basıldığında devir hızlı yükselir, bırakınca egzoz homurtusuyla düşer
            const targetRpmRatio = isGasPressed ? Math.min(1, 0.35 + absSpeed / 10) : (absSpeed / 12);
            
            const baseFreq = 34 + targetRpmRatio * 75;
            engineOsc1.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.08);
            engineOsc2.frequency.setTargetAtTime(baseFreq * 2.02, audioCtx.currentTime, 0.08);
            subBassOsc.frequency.setTargetAtTime(baseFreq * 1.5, audioCtx.currentTime, 0.08);

            // Gaz verince egzoz kapağı açılır (filtre frekansı ve ses şiddeti artar)
            const targetFilter = isGasPressed ? (240 + targetRpmRatio * 480) : (150 + targetRpmRatio * 200);
            filterNode.frequency.setTargetAtTime(targetFilter, audioCtx.currentTime, 0.08);

            // Rölantideyken dereceli egzantrik patırtısı belirginleşir, devirlenince düzleşir
            lfoGain.gain.setTargetAtTime(isGasPressed ? 1.5 : 5.2, audioCtx.currentTime, 0.1);
            lfoOsc.frequency.setTargetAtTime(isGasPressed ? 14 : 7.8, audioCtx.currentTime, 0.1);

            const targetVol = isGasPressed ? 0.22 : 0.13;
            engineGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.08);
        }

        function playCrashSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(28, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.36);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('btnSound').innerText = soundEnabled ? 'Ses: Açık' : 'Ses: Kapalı';
            if (soundEnabled && !isAudioStarted) initAudio();
        }

        // --- SAHNE VE IŞIK KURULUMU ---
        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);
        scene.fog = new THREE.Fog(0x1e293b, 38, 105);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 160);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.8);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
        dirLight.position.set(22, 38, 22);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 32;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Otopark Asfaltı ve Çevre Kaldırımları
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(130, 130),
            new THREE.MeshStandardMaterial({ color: 0x26262a, roughness: 0.88 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(110, 55, 0x3f3f46, 0x333338);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- DETAYLI 3D TOFAŞ DOĞAN SLX MODELİ ---
        const carGroup = new THREE.Group();
        const slxWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.22, metalness: 0.15 });
        const darkGlass = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.08, metalness: 0.85 });
        const matteBlack = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.75 });
        const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.92, roughness: 0.15 });
        const redLogoMat = new THREE.MeshBasicMaterial({ color: 0xdc2626 });

        // Alt Ana Gövde (Köşeli klasik Doğan hatları)
        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.56, 4.28), slxWhite);
        lowerBody.position.y = 0.48;
        lowerBody.castShadow = true;
        carGroup.add(lowerBody);

        // Kaput Üzeri Hafif Kabartma Çizgisi
        const hoodRidge = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.04, 1.35), slxWhite);
        hoodRidge.position.set(0, 0.77, 1.35);
        carGroup.add(hoodRidge);

        // Üst Kabin (Tavan ve Direkler)
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.54, 2.15), slxWhite);
        cabin.position.set(0, 1.02, -0.18);
        cabin.castShadow = true;
        carGroup.add(cabin);

        // Ön Cam (Eğimli)
        const frontGlass = new THREE.Mesh(new THREE.PlaneGeometry(1.52, 0.52), darkGlass);
        frontGlass.position.set(0, 1.02, 0.91);
        frontGlass.rotation.x = -0.25;
        carGroup.add(frontGlass);

        // Arka Cam (Eğimli)
        const rearGlass = new THREE.Mesh(new THREE.PlaneGeometry(1.52, 0.50), darkGlass);
        rearGlass.position.set(0, 1.02, -1.27);
        rearGlass.rotation.y = Math.PI;
        rearGlass.rotation.x = -0.24;
        carGroup.add(rearGlass);

        // Yan Camlar (2 Numara Cam Filmi)
        const sideGlass = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.43, 1.92), darkGlass);
        sideGlass.position.set(0, 1.02, -0.18);
        carGroup.add(sideGlass);

        // Yan Kapı Çıtaları (SLX Siyah İnce Çıta)
        const trimLeft = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 2.75), matteBlack);
        trimLeft.position.set(-0.94, 0.52, -0.05);
        const trimRight = trimLeft.clone();
        trimRight.position.x = 0.94;
        carGroup.add(trimLeft, trimRight);

        // Yan Aynalar (Gövde Rengi SLX Ayna)
        const mirrorLeft = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.13, 0.16), slxWhite);
        mirrorLeft.position.set(-1.02, 0.84, 0.65);
        const mirrorRight = mirrorLeft.clone();
        mirrorRight.position.x = 1.02;
        carGroup.add(mirrorLeft, mirrorRight);

        // Doğan SLX Gövde Rengi Ön Tampon + Siyah Üst Kuşak + Sis Farları
        const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(1.92, 0.28, 0.28), slxWhite);
        frontBumper.position.set(0, 0.34, 2.16);
        frontBumper.castShadow = true;
        const frontBumperStrip = new THREE.Mesh(new THREE.BoxGeometry(1.94, 0.06, 0.29), matteBlack);
        frontBumperStrip.position.set(0, 0.44, 2.16);
        carGroup.add(frontBumper, frontBumperStrip);

        // Tampon İçi Sis Farları
        const fogMat = new THREE.MeshBasicMaterial({ color: 0xfef9c3 });
        const fogLeft = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.09, 0.05), fogMat);
        fogLeft.position.set(-0.65, 0.31, 2.30);
        const fogRight = fogLeft.clone();
        fogRight.position.x = 0.65;
        carGroup.add(fogLeft, fogRight);

        // Doğan SLX Ön Panjur & Kırmızı Tofaş Logosu
        const grille = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.22, 0.06), matteBlack);
        grille.position.set(0, 0.61, 2.14);
        const grilleChrome = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.03, 0.07), chromeMat);
        grilleChrome.position.set(0, 0.61, 2.14);
        const tofasBadge = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.11, 0.08), redLogoMat);
        tofasBadge.position.set(0, 0.61, 2.14);
        carGroup.add(grille, grilleChrome, tofasBadge);

        // Geniş Dikdörtgen Farlar ve Turuncu Sinyaller
        const headLightMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
        const blinkerMat = new THREE.MeshBasicMaterial({ color: 0xf97316 });
        const hlLeft = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.21, 0.06), headLightMat);
        hlLeft.position.set(-0.64, 0.61, 2.14);
        const hlRight = hlLeft.clone();
        hlRight.position.x = 0.64;

        const blLeft = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.21, 0.06), blinkerMat);
        blLeft.position.set(-0.87, 0.61, 2.14);
        const blRight = blLeft.clone();
        blRight.position.x = 0.87;
        carGroup.add(hlLeft, hlRight, blLeft, blRight);

        // Doğan SLX Gövde Rengi Arka Tampon + Egzoz Ucu
        const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(1.92, 0.28, 0.28), slxWhite);
        rearBumper.position.set(0, 0.34, -2.16);
        const rearBumperStrip = new THREE.Mesh(new THREE.BoxGeometry(1.94, 0.06, 0.29), matteBlack);
        rearBumperStrip.position.set(0, 0.44, -2.16);
        const exhaustPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.25, 12), chromeMat);
        exhaustPipe.rotation.x = Math.PI / 2;
        exhaustPipe.position.set(-0.58, 0.19, -2.28);
        carGroup.add(rearBumper, rearBumperStrip, exhaustPipe);

        // Şeffaf SLX Arka Stoplar ve Plaka
        const tailMatLeft = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
        const tailMatRight = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
        const tlLeft = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.21, 0.06), tailMatLeft);
        tlLeft.position.set(-0.63, 0.62, -2.14);
        const tlRight = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.21, 0.06), tailMatRight);
        tlRight.position.set(0.63, 0.62, -2.14);
        const rearPlate = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.14, 0.05), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        rearPlate.position.set(0, 0.61, -2.14);
        carGroup.add(tlLeft, tlRight, rearPlate);

        // 4 Tekerlek (6 Kol CMS Jant Detaylı & Basık Ayar)
        const wheels = [];
        const frontWheelPivots = [];
        function createCmsWheel(x, z, isFront) {
            const pivot = new THREE.Group();
            pivot.position.set(x, 0.31, z);

            const wheelMesh = new THREE.Group();
            const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.31, 0.24, 24), matteBlack);
            tire.rotation.z = Math.PI / 2;
            tire.castShadow = true;

            const rimDish = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.245, 18), chromeMat);
            rimDish.rotation.z = Math.PI / 2;

            // 6 Kol Jant Kolları
            for (let i = 0; i < 3; i++) {
                const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.255, 0.38, 0.045), matteBlack);
                spoke.rotation.x = (i * Math.PI) / 3;
                wheelMesh.add(spoke);
            }

            wheelMesh.add(tire, rimDish);
            pivot.add(wheelMesh);
            carGroup.add(pivot);

            wheels.push(wheelMesh);
            if (isFront) frontWheelPivots.push(pivot);
        }

        createCmsWheel(-0.92, 1.32, true);
        createCmsWheel(0.92, 1.32, true);
        createCmsWheel(-0.92, -1.32, false);
        createCmsWheel(0.92, -1.32, false);

        scene.add(carGroup);

        // --- GERÇEKÇİ PARK HALİNDEKİ ARAÇ MODELLERİ (SEDAN & SUV) ---
        let obstacles = [];

        function clearObstacles() {
            obstacles.forEach(o => scene.remove(o.mesh));
            obstacles = [];
        }

        function addRealisticParkedCar(x, z, rotY, colorHex, type = 'SEDAN') {
            const npc = new THREE.Group();
            const paintMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.28, metalness: 0.35 });

            if (type === 'SUV') {
                // Gerçekçi Modern SUV (BMW X1 / Kadjar tarzı)
                const body = new THREE.Mesh(new THREE.BoxGeometry(1.96, 0.72, 4.35), paintMat);
                body.position.y = 0.58;
                body.castShadow = true;

                const roof = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.62, 2.75), paintMat);
                roof.position.set(0, 1.22, -0.35);
                roof.castShadow = true;

                const windows = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.48, 2.55), darkGlass);
                windows.position.set(0, 1.22, -0.35);

                // Tavan Rayları ve Ön Böbrek Panjur
                const railL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 2.2), chromeMat);
                railL.position.set(-0.72, 1.55, -0.35);
                const railR = railL.clone(); railR.position.x = 0.72;

                const grill = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.28, 0.06), matteBlack);
                grill.position.set(0, 0.72, 2.18);

                const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.14, 0.06), headLightMat);
                hl1.position.set(-0.68, 0.76, 2.18);
                const hl2 = hl1.clone(); hl2.position.x = 0.68;

                npc.add(body, roof, windows, railL, railR, grill, hl1, hl2);
            } else {
                // Modern C-Segment Sedan
                const body = new THREE.Mesh(new THREE.BoxGeometry(1.88, 0.58, 4.4), paintMat);
                body.position.y = 0.48;
                body.castShadow = true;

                const cabinMesh = new THREE.Mesh(new THREE.BoxGeometry(1.64, 0.52, 2.25), paintMat);
                cabinMesh.position.set(0, 1.0, -0.15);
                cabinMesh.castShadow = true;

                const windows = new THREE.Mesh(new THREE.BoxGeometry(1.67, 0.42, 2.05), darkGlass);
                windows.position.set(0, 1.0, -0.15);

                const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.14, 0.06), headLightMat);
                hl1.position.set(-0.65, 0.58, 2.21);
                const hl2 = hl1.clone(); hl2.position.x = 0.65;

                const tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.15, 0.06), tailMatLeft);
                tl1.position.set(-0.62, 0.6, -2.21);
                const tl2 = tl1.clone(); tl2.position.x = 0.62;

                npc.add(body, cabinMesh, windows, hl1, hl2, tl1, tl2);
            }

            // 4 Tekerlek Ekle
            const wCoords = [[-0.94, 1.35], [0.94, 1.35], [-0.94, -1.35], [0.94, -1.35]];
            wCoords.forEach(([wx, wz]) => {
                const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.25, 18), matteBlack);
                tire.rotation.z = Math.PI / 2;
                tire.position.set(wx, 0.34, wz);
                const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.26, 12), chromeMat);
                rim.rotation.z = Math.PI / 2;
                rim.position.set(wx, 0.34, wz);
                npc.add(tire, rim);
            });

            npc.position.set(x, 0, z);
            npc.rotation.y = rotY;
            scene.add(npc);

            const isRotated = Math.abs(Math.sin(rotY)) > 0.7;
            obstacles.push({
                x, z,
                w: isRotated ? 4.35 : 1.92,
                d: isRotated ? 1.92 : 4.35,
                mesh: npc
            });
        }

        function addCone(x, z) {
            const cone = new THREE.Mesh(
                new THREE.ConeGeometry(0.25, 0.75, 12),
                new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.4 })
            );
            cone.position.set(x, 0.375, z);
            cone.castShadow = true;
            scene.add(cone);
            obstacles.push({ x, z, w: 0.45, d: 0.45, mesh: cone });
        }

        function addBarrier(x, z, w, d) {
            const barrier = new THREE.Mesh(
                new THREE.BoxGeometry(w, 0.85, d),
                new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 })
            );
            barrier.position.set(x, 0.425, z);
            barrier.castShadow = true;
            scene.add(barrier);
            obstacles.push({ x, z, w, d, mesh: barrier });
        }

        // --- HEDEF PARK ALANI ---
        const targetZone = new THREE.Group();
        const zoneFloor = new THREE.Mesh(
            new THREE.PlaneGeometry(2.7, 5.0),
            new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.28, side: THREE.DoubleSide })
        );
        zoneFloor.rotation.x = -Math.PI / 2;
        zoneFloor.position.y = 0.03;
        targetZone.add(zoneFloor);

        const zoneBorder = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(2.7, 0.05, 5.0)),
            new THREE.LineBasicMaterial({ color: 0x10b981 })
        );
        zoneBorder.position.y = 0.04;
        targetZone.add(zoneBorder);
        scene.add(targetZone);

        // --- 5 PARK BÖLÜMÜ ---
        const levels = [
            {
                hint: "Doğan SLX'i iki aracın arasına düz park et",
                start: { x: 0, z: -10, rot: 0 },
                target: { x: 0, z: 6, rot: 0 },
                setup: () => {
                    addRealisticParkedCar(-3.1, 6, 0, 0x1e3a8a, 'SUV');
                    addRealisticParkedCar(3.1, 6, 0, 0x991b1b, 'SEDAN');
                    addBarrier(0, 9.8, 10, 0.5);
                }
            },
            {
                hint: "Sağa dönüp SUV ve Sedan arasına gir",
                start: { x: -8, z: -8, rot: 0 },
                target: { x: 6, z: 2, rot: Math.PI / 2 },
                setup: () => {
                    addRealisticParkedCar(6, -1.3, Math.PI / 2, 0xdc2626, 'SEDAN');
                    addRealisticParkedCar(6, 5.3, Math.PI / 2, 0x0f172a, 'SUV');
                    addBarrier(9.6, 2, 0.5, 12);
                    addCone(-2, 2);
                }
            },
            {
                hint: "Geri vites (R) ile iki araç arasına paralel park",
                start: { x: 3.5, z: -4, rot: 0 },
                target: { x: 7, z: 3, rot: 0 },
                setup: () => {
                    addRealisticParkedCar(7, -2.7, 0, 0xeab308, 'SEDAN');
                    addRealisticParkedCar(7, 8.7, 0, 0x334155, 'SUV');
                    addBarrier(9.3, 3, 0.5, 18);
                }
            },
            {
                hint: "Dar koridordan L dönüşü ile geri park et",
                start: { x: -8, z: 6, rot: Math.PI / 2 },
                target: { x: 4, z: -6, rot: 0 },
                setup: () => {
                    addBarrier(-2, 1.5, 14, 0.5);
                    addRealisticParkedCar(0.8, -6, 0, 0x475569, 'SUV');
                    addRealisticParkedCar(7.2, -6, 0, 0xb91c1c, 'SEDAN');
                    addBarrier(4, -9.6, 10, 0.5);
                    addCone(8, 6);
                }
            },
            {
                hint: "Usta Şoför: Dar alana geri geri yanaş",
                start: { x: -9, z: -9, rot: 0 },
                target: { x: 8, z: 7, rot: Math.PI },
                setup: () => {
                    addRealisticParkedCar(4.8, 7, 0, 0x6d28d9, 'SUV');
                    addRealisticParkedCar(11.2, 7, 0, 0x047857, 'SEDAN');
                    addBarrier(0, -1, 12, 0.5);
                    addCone(-4, 5); addCone(1, 3);
                    addBarrier(8, 10.6, 10, 0.5);
                }
            }
        ];

        // --- OYUN KONTROL VE FİZİK ---
        let currentLevel = 0;
        let carState = { x: 0, z: 0, rot: 0, speed: 0, steer: 0 };
        let gear = 1;
        let inputs = { left: false, right: false, gas: false, brake: false };
        let cameraMode = 0;
        let parkTimer = 0;
        let isGamePaused = false;
        let modalActionType = 'RETRY';

        function loadLevel(idx) {
            currentLevel = idx;
            const lvl = levels[idx];
            clearObstacles();
            lvl.setup();

            carState = { x: lvl.start.x, z: lvl.start.z, rot: lvl.start.rot, speed: 0, steer: 0 };
            gear = 1;
            updateGearUI();
            parkTimer = 0;
            isGamePaused = false;
            document.getElementById('parkWrap').style.display = 'none';
            document.getElementById('modal').style.display = 'none';

            targetZone.position.set(lvl.target.x, 0, lvl.target.z);
            targetZone.rotation.y = lvl.target.rot;

            document.getElementById('levelText').innerText = `BÖLÜM ${idx + 1} / ${levels.length}`;
            document.getElementById('hintText').innerText = lvl.hint;
        }

        function resetLevel() { loadLevel(currentLevel); }

        function toggleGear() {
            initAudio();
            gear = gear === 1 ? -1 : 1;
            updateGearUI();
        }

        function updateGearUI() {
            const btn = document.getElementById('btnGear');
            if (gear === 1) {
                btn.innerText = 'D';
                btn.classList.remove('reverse');
                tailMatRight.color.setHex(0xdc2626);
            } else {
                btn.innerText = 'R';
                btn.classList.add('reverse');
                tailMatRight.color.setHex(0xffffff);
            }
        }

        function toggleCamera() { cameraMode = (cameraMode + 1) % 3; }

        function bindBtn(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); initAudio(); inputs[key] = true; el.classList.add('active'); };
            const end = (e) => { e.preventDefault(); inputs[key] = false; el.classList.remove('active'); };
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);
        }

        bindBtn('btnLeft', 'left');
        bindBtn('btnRight', 'right');
        bindBtn('btnGas', 'gas');
        bindBtn('btnBrake', 'brake');

        window.addEventListener('keydown', e => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = true;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = true;
            if (e.key === 'r' || e.key === 'R') toggleGear();
            if (e.key === 'c' || e.key === 'C') toggleCamera();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = false;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = false;
        });

        function checkCollisions() {
            const halfW = 0.86;
            const halfL = 2.02;
            const cos = Math.cos(carState.rot);
            const sin = Math.sin(carState.rot);

            const corners = [
                { x: carState.x + halfW * cos + halfL * sin, z: carState.z - halfW * sin + halfL * cos },
                { x: carState.x - halfW * cos + halfL * sin, z: carState.z + halfW * sin + halfL * cos },
                { x: carState.x + halfW * cos - halfL * sin, z: carState.z - halfW * sin - halfL * cos },
                { x: carState.x - halfW * cos - halfL * sin, z: carState.z + halfW * sin - halfL * cos }
            ];

            for (let obs of obstacles) {
                const minX = obs.x - obs.w / 2;
                const maxX = obs.x + obs.w / 2;
                const minZ = obs.z - obs.d / 2;
                const maxZ = obs.z + obs.d / 2;

                for (let pt of corners) {
                    if (pt.x > minX && pt.x < maxX && pt.z > minZ && pt.z < maxZ) return true;
                }
            }
            return false;
        }

        function showModal(title, desc, btnText, actionType) {
            isGamePaused = true;
            modalActionType = actionType;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalBtn').innerText = btnText;
            document.getElementById('modal').style.display = 'flex';
        }

        function handleModalAction() {
            if (modalActionType === 'NEXT') {
                loadLevel((currentLevel + 1) % levels.length);
            } else {
                resetLevel();
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            updateEngineSound(carState.speed, inputs.gas && !isGamePaused, dt);

            if (!isGamePaused) {
                const maxSteer = 0.52;
                if (inputs.left) carState.steer = Math.min(carState.steer + 2.8 * dt, maxSteer);
                else if (inputs.right) carState.steer = Math.max(carState.steer - 2.8 * dt, -maxSteer);
                else carState.steer *= 0.82;

                const maxSpeed = gear === 1 ? 11 : 6.5;
                if (inputs.gas) {
                    carState.speed += gear * 9.5 * dt;
                    if (gear === 1 && carState.speed > maxSpeed) carState.speed = maxSpeed;
                    if (gear === -1 && carState.speed < -maxSpeed) carState.speed = -maxSpeed;
                } else {
                    carState.speed *= 0.94;
                }

                if (inputs.brake) {
                    carState.speed *= 0.82;
                    tailMatLeft.color.setHex(0xff0000);
                } else {
                    tailMatLeft.color.setHex(0x991b1b);
                }

                if (Math.abs(carState.speed) < 0.05) carState.speed = 0;

                if (carState.speed !== 0) {
                    const wheelBase = 2.65;
                    const angularVel = (carState.speed / wheelBase) * Math.tan(carState.steer);
                    carState.rot += angularVel * dt;
                    carState.x += Math.sin(carState.rot) * carState.speed * dt;
                    carState.z += Math.cos(carState.rot) * carState.speed * dt;
                }

                carGroup.position.set(carState.x, 0, carState.z);
                carGroup.rotation.y = carState.rot;

                frontWheelPivots.forEach(p => p.rotation.y = carState.steer);
                wheels.forEach(w => w.rotation.x += carState.speed * dt * 3.2);

                if (checkCollisions()) {
                    playCrashSound();
                    showModal("ÇARPTIN!", "Doğan SLX'i çizdirmeden tekrar dene.", "Tekrar Dene", "RETRY");
                }

                const lvl = levels[currentLevel];
                const dist = Math.hypot(carState.x - lvl.target.x, carState.z - lvl.target.z);
                let angleDiff = Math.abs((carState.rot - lvl.target.rot) % (Math.PI * 2));
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                if (dist < 0.85 && angleDiff < 0.22 && Math.abs(carState.speed) < 0.2) {
                    parkTimer += dt;
                    document.getElementById('parkWrap').style.display = 'block';
                    document.getElementById('parkBar').style.width = `${Math.min((parkTimer / 1.5) * 100, 100)}%`;
                    zoneFloor.material.color.setHex(0x38bdf8);

                    if (parkTimer >= 1.5) {
                        const isLast = currentLevel === levels.length - 1;
                        showModal(
                            isLast ? "TÜM BÖLÜMLER BİTTİ!" : "MÜKEMMEL PARK!",
                            isLast ? "Doğan SLX ile tüm parkurları tamamladın!" : `Bölüm ${currentLevel + 1} tamamlandı.`,
                            isLast ? "Baştan Oyna" : "Sonraki Bölüm",
                            "NEXT"
                        );
                    }
                } else {
                    parkTimer = 0;
                    document.getElementById('parkWrap').style.display = 'none';
                    zoneFloor.material.color.setHex(0x10b981);
                }
            }

            if (cameraMode === 0) {
                const offsetDist = gear === 1 ? -7.6 : 7.6;
                const targetCamX = carState.x + Math.sin(carState.rot) * offsetDist;
                const targetCamZ = carState.z + Math.cos(carState.rot) * offsetDist;
                camera.position.lerp(new THREE.Vector3(targetCamX, 4.7, targetCamZ), 0.1);
                camera.lookAt(carState.x, 0.85, carState.z);
            } else if (cameraMode === 1) {
                camera.position.lerp(new THREE.Vector3(carState.x, 14.5, carState.z - 2), 0.15);
                camera.lookAt(carState.x, 0, carState.z);
            } else {
                const hoodX = carState.x + Math.sin(carState.rot) * 0.55;
                const hoodZ = carState.z + Math.cos(carState.rot) * 0.55;
                camera.position.set(hoodX, 1.42, hoodZ);
                camera.lookAt(
                    carState.x + Math.sin(carState.rot) * 10,
                    1.05,
                    carState.z + Math.cos(carState.rot) * 10
                );
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadLevel(0);
        animate();
    </script>
</body>
</html>
